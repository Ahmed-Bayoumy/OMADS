[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/OMADS"]

[tool.hatch.build]
exclude = [
    "*.so",
    "*.pyd",
    "*.dll",
    "*.dylib"
]

[project]
name = "OMADS"
version = "2604.01"
requires-python = ">=3.10"
description = "Optimization using Mesh Adaptive Direct Search (MADS)"
readme = "README.md"

authors = [
    { name = "Ahmed H. Bayoumy", email = "ahmed.bayoumy@mail.mcgill.ca" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.2.6",           # ✅ Ok except for some old versions of TF
    "pandas>=2.2.3, <3.0.0",          # 🟢 Fixes google-colab & Gradio errors
    "ipython==7.34.0",        # 🟢 Fixes the "Runtime Crash" warning
    "pydantic>=2.0, <=2.12.3",# 🟢 Fixes Gradio compatibility
    "requests>=2.32.4",       # 🟢 Fixes google-colab system error
    "deap==1.4.0",
    "paramiko>=3.4.0, <4.0.0",# 🟢 Fixes decorator/bcrypt version jump
    "scipy>=1.15.3",
    "samplerslib>=2602.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.8",
    "plotly>=5.24.1",
]

test = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# E9, F63, F7, F82 are standard in Ruff's default 'E' and 'F' selections
select = ["E", "F", "C90"] 

[tool.ruff.lint.mccabe]
max-complexity = 10

