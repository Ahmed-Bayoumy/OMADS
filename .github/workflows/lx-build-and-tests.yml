# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: lx-build-and-pytest

on:
  push:
    branches: [ "DEV" ]
  pull_request:
    branches: [ "DEV" ]

permissions:
  contents: read

jobs:
  lx-build-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v4
        with:
          # Automatically uses the version from the matrix
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # uv sync will respect the python-version set by setup-uv
        run: uv sync --frozen

      - name: ruff lint
        run: uvx ruff check .

      - name: Build package
        run: uv build

      - name: Install built wheel
        run: |
          uv pip install --find-links dist omads
          uv pip install plotly matplotlib flake8 pytest pytest-cov

      - name: Run tests
        # Use 'uv run' to ensure the correct virtualenv is used
        run: uv run pytest
